name: Landscape quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: node verification/audio-structure.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landscape-pixels-and-results
          path: |
            verification/
            test-results/
